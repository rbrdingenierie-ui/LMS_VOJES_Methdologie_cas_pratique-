<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La méthodologie du cas pratique · BTS Banque · Cours en autonomie</title>
<meta name="description" content="BTS Banque (VOJES, bloc 4) : la méthodologie du cas pratique. Méthode pas à pas, cas guidé et cas en autonomie, avec correction, à faire à son rythme.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231F3864'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<style>
/* La méthodologie du cas pratique — BTS Banque
   Même identité visuelle que les autres cours (navy, orange, teal, violet). */
:root {
  --navy: #1F3864;
  --navy-soft: #4A5C82;
  --orange: #B93A09;
  --orange-soft: #FBEAE3;
  --teal: #12796B;
  --teal-soft: #E3F3F1;
  --violet: #5E3E96;
  --violet-soft: #EFE8F8;
  --rose: #B4235A;
  --rose-soft: #FBE5ED;
  --blue: #0B6B8C;
  --blue-soft: #E0F0F6;
  --gold: #7D5E26;
  --gold-soft: #F6EEDC;
  --ok: #17692F;
  --ok-soft: #E3F4E8;
  --ko: #A61B1B;
  --ko-soft: #FBE7E7;
  --bg: #F7F8FA;
  --white: #FFFFFF;
  --ink: #1B2437;
  --track: #8592B0;
  --line: #D5DBE8;
  --accent: var(--navy);
  --accent-soft: #E8EDF6;
  --scale: 1;
  --radius: 14px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
  font-size: calc(17px * var(--scale)); line-height: 1.6;
}
img { max-width: 100%; height: auto; }
main { overflow-wrap: break-word; hyphens: manual; }
fieldset { min-width: 0; }
a { color: var(--navy); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--navy); outline-offset: 2px;
}
.skip { position: absolute; left: -9999px; top: 0; background: var(--navy); color: #fff; padding: 12px 18px; z-index: 3000; border-radius: 0 0 10px 0; font-weight: 700; }
.skip:focus { left: 0; }

/* ---------- barre du haut ---------- */
.topbar { position: sticky; top: 0; z-index: 1000; background: var(--navy); color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.topbar-in { max-width: 1180px; margin: 0 auto; padding: 8px 14px; display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 800; font-size: calc(16px * min(var(--scale), 1.15)); color: #fff; text-decoration: none; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.brand small { display: block; font-weight: 400; font-size: calc(12px * min(var(--scale), 1.15)); opacity: .85; }
.brand span.t { min-width: 0; }
.tb-btn { min-width: 44px; font: inherit; font-size: calc(14px * min(var(--scale), 1.15)); font-weight: 700; min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 2px solid rgba(255,255,255,.55); background: transparent; color: #fff; cursor: pointer; white-space: nowrap; }
.tb-btn:hover { background: rgba(255,255,255,.14); }
.tb-btn[aria-expanded="true"] { background: #fff; color: var(--navy); }
.tb-menu { display: none; }

.a11y-panel { background: #fff; color: var(--ink); border-bottom: 3px solid var(--navy); }
.a11y-panel[hidden] { display: none; }
.a11y-in { max-width: 1180px; margin: 0 auto; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.a11y-in .lab { font-weight: 800; color: var(--navy); margin-right: 4px; }
.tg { font: inherit; font-size: calc(14px * var(--scale)); font-weight: 700; min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--track); background: #fff; color: var(--navy-soft); cursor: pointer; }
.tg:hover { border-color: var(--navy); }
.tg[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.sz { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--navy); }
.sz button { font: inherit; font-weight: 800; min-width: 44px; min-height: 44px; border-radius: 10px; border: 2px solid var(--track); background: #fff; color: var(--navy); cursor: pointer; }

/* ---------- mise en page ---------- */
.layout { max-width: 1180px; margin: 0 auto; padding: 18px 14px 60px; display: grid; grid-template-columns: 1fr; gap: 18px; }
.side { display: none; }
.side.open { display: block; }
.side nav { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 10px; }
.side h2 { font-size: calc(13px * var(--scale)); letter-spacing: .06em; text-transform: uppercase; color: var(--navy-soft); margin: 10px 8px 6px; }
.side a.mi { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; text-decoration: none; color: var(--ink); padding: 8px; border-radius: 10px; min-height: 48px; border-left: 5px solid transparent; }
.side a.mi:hover { background: var(--accent-soft); }
.side a.mi[aria-current="page"] { background: var(--accent-soft); border-left-color: var(--accent); font-weight: 700; }
.side .num { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: calc(14px * var(--scale)); }
.side .mt { line-height: 1.25; font-size: calc(15px * var(--scale)); }
.side .bar { display: block; height: 6px; background: var(--line); border-radius: 4px; margin-top: 5px; overflow: hidden; }
.side .bar i { display: block; height: 100%; background: var(--accent); }
@media (min-width: 900px) {
  .layout { grid-template-columns: 290px minmax(0, 1fr); align-items: start; }
  .side { display: block; position: sticky; top: 76px; }
  .tb-menu { display: none !important; }
}
@media (max-width: 899px) { .tb-menu { display: inline-block; } }

main { min-width: 0; outline: none; }
.card { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px; }
main h1 { font-size: calc(28px * var(--scale)); line-height: 1.2; margin: 4px 0 8px; color: var(--accent); outline: none; }
main h2 { font-size: calc(22px * var(--scale)); color: var(--accent); margin: 26px 0 8px; line-height: 1.25; }
main h3 { font-size: calc(18.5px * var(--scale)); color: var(--navy); margin: 22px 0 6px; line-height: 1.3; }
main p { margin: 0 0 12px; }
main ul, main ol { margin: 0 0 12px; padding-left: 24px; }
main li { margin: 4px 0; }
.kicker { font-weight: 800; letter-spacing: .05em; text-transform: uppercase; font-size: calc(13px * var(--scale)); color: var(--accent); }
.lead { font-size: calc(19px * var(--scale)); color: var(--navy-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--navy); font-weight: 700; font-size: calc(14px * var(--scale)); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.miss { background: #EEF0F5; color: #4A5368; }

.btn { font: inherit; font-weight: 800; font-size: calc(16px * var(--scale)); min-height: 48px; padding: 10px 20px; border-radius: 12px; border: 2px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { filter: brightness(1.12); }
.btn.sec { background: #fff; color: var(--accent); }
.btn.sec:hover { background: var(--accent-soft); filter: none; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }

/* ---------- modules (accents) ---------- */
.m1 { --accent: var(--navy); --accent-soft: #E8EDF6; }
.m2 { --accent: var(--teal); --accent-soft: var(--teal-soft); }
.m3 { --accent: var(--orange); --accent-soft: var(--orange-soft); }
.m4 { --accent: var(--violet); --accent-soft: var(--violet-soft); }
.m5 { --accent: var(--rose); --accent-soft: var(--rose-soft); }
.m6 { --accent: var(--blue); --accent-soft: var(--blue-soft); }
.mq { --accent: var(--gold); --accent-soft: var(--gold-soft); }

/* ---------- accueil ---------- */
.hero { background: linear-gradient(135deg, var(--navy) 0%, #2D4F8C 70%); color: #fff; border-radius: var(--radius); padding: 26px 24px; margin-bottom: 18px; }
.hero h1 { color: #fff; font-size: calc(30px * var(--scale)); }
.hero p { color: #E6ECF8; max-width: 62ch; }
.hero .btn { background: #fff; color: var(--navy); border-color: #fff; }
.hero .btn.sec { background: transparent; color: #fff; border-color: #fff; }
.steps3 { display: grid; gap: 12px; grid-template-columns: 1fr; margin: 10px 0 0; padding: 0; list-style: none; }
@media (min-width: 640px) { .steps3 { grid-template-columns: repeat(3, 1fr); } }
.steps3 li { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 0; }
.steps3 li > b:first-child { display: block; color: var(--navy); }
.mcards { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .mcards { grid-template-columns: repeat(2, 1fr); } }
.mcard { background: #fff; border: 2px solid var(--line); border-top: 8px solid var(--accent); border-radius: var(--radius); padding: 16px 18px; text-decoration: none; color: var(--ink); display: block; }
.mcard:hover { box-shadow: 0 6px 18px -8px rgba(31,56,100,.45); }
.mcard .n { font-weight: 800; color: var(--accent); font-size: calc(13px * var(--scale)); letter-spacing: .05em; text-transform: uppercase; }
.mcard h3 { margin: 4px 0 4px; color: var(--ink); font-size: calc(19px * var(--scale)); }
.mcard p { margin: 0 0 8px; color: var(--navy-soft); font-size: calc(15px * var(--scale)); }
.prog { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }
.ptxt { font-size: calc(13.5px * var(--scale)); color: var(--navy-soft); margin-top: 4px; }

/* ---------- vue module ---------- */
.steplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steplist a { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); background: #fff; min-height: 52px; }
.steplist a:hover { border-color: var(--accent); background: var(--accent-soft); }
.steplist .sn { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); font-weight: 800; display: grid; place-items: center; }
.steplist .done .sn { background: var(--ok); border-color: var(--ok); color: #fff; }
.steplist .tag { font-size: calc(13px * var(--scale)); color: var(--navy-soft); }
.objs { margin: 0; padding-left: 22px; }

/* ---------- étape ---------- */
.crumb { font-size: calc(14px * var(--scale)); color: var(--navy-soft); margin-bottom: 6px; }
.crumb a { color: var(--navy-soft); display: inline-block; padding: 13px 4px; margin: -13px -4px; }
.stepbar { display: flex; gap: 5px; margin: -2px 0 4px; flex-wrap: wrap; }
.stepbar a { width: 30px; height: 44px; padding: 17px 0; display: block; }
.stepbar a::before { content: ""; display: block; height: 10px; border-radius: 6px; background: var(--line); }
.stepbar a.done::before { background: var(--ok); }
.stepbar a.cur::before { background: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
.stepbar a:focus-visible { outline: 3px solid var(--navy); outline-offset: 0; border-radius: 6px; }
.stepnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; flex-wrap: wrap; }

.bloc { margin: 0 0 18px; }
.act { background: #fff; border: 2px solid var(--line); border-left: 8px solid var(--accent); border-radius: var(--radius); padding: 16px 18px; }
.act > h3 { margin-top: 0; }
.consigne { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-weight: 600; }
.consigne::before { content: "Consigne · "; font-weight: 800; color: var(--accent); }
.note { background: var(--gold-soft); border-left: 6px solid var(--gold); border-radius: 10px; padding: 12px 16px; }
.note b.nt { color: var(--gold); }
.essentiel { background: var(--teal-soft); border: 2px solid var(--teal); border-radius: var(--radius); padding: 14px 18px; }
.essentiel h3 { margin: 0 0 6px; color: var(--teal); }
.essentiel ul { margin: 0; }
.essentiel li { font-weight: 600; margin: 6px 0; }
.docbox { background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.docbox blockquote { margin: 0; padding: 8px 14px; border-left: 5px solid var(--accent); background: var(--accent-soft); border-radius: 8px; }
.docbox blockquote p:last-child { margin-bottom: 0; }

table.dt { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: calc(16px * var(--scale)); background: #fff; }
table.dt th, table.dt td { border: 2px solid var(--line); padding: 8px 10px; vertical-align: top; text-align: left; }
table.dt th { background: var(--accent-soft); color: var(--navy); }
.tscroll { overflow-x: auto; }
table.dt caption { text-align: left; font-weight: 700; color: var(--navy); padding: 4px 0; }

figure.fig { margin: 0 0 18px; }
figure.fig img { border: 2px solid var(--line); border-radius: 10px; background: #fff; cursor: zoom-in; display: block; margin: 0 auto; }
figure.fig figcaption { font-size: calc(14px * var(--scale)); color: var(--navy-soft); text-align: center; margin-top: 6px; }
.zoom { margin-top: 8px; }

.vid { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; background: #fff; border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.vid .pl { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 22px; }
.vid h3 { margin: 0 0 2px; }
.vid p { margin: 0 0 8px; color: var(--navy-soft); font-size: calc(15px * var(--scale)); }

/* ---------- activités ---------- */
fieldset.item { border: 2px solid var(--line); border-radius: 12px; margin: 0 0 10px; padding: 10px 14px 12px; background: #fff; }
fieldset.item legend { float: left; width: 100%; padding: 0; margin: 0 0 8px; font-weight: 700; color: var(--navy); }
fieldset.item legend + * { clear: both; }
fieldset.item.good { border-color: var(--ok); background: var(--ok-soft); }
fieldset.item.bad { border-color: var(--ko); background: var(--ko-soft); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices label { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 6px 16px; border: 2px solid var(--track); border-radius: 12px; background: #fff; cursor: pointer; font-weight: 700; }
.choices input { width: 24px; height: 24px; accent-color: var(--accent); }
.choices label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choices.col { flex-direction: column; }
.choices.col label { width: 100%; font-weight: 500; }
.fb { margin: 8px 0 0; font-size: calc(15.5px * var(--scale)); }
.fb.g { color: var(--ok); font-weight: 700; }
.fb.b { color: var(--ko); font-weight: 700; }
.fb .ex { color: var(--ink); font-weight: 400; }
.res { margin-top: 12px; font-weight: 800; font-size: calc(18px * var(--scale)); }
.res.ok { color: var(--ok); }
.res.part { color: var(--orange); }
.props { margin: 6px 0 12px; padding: 0; list-style: none; display: grid; gap: 6px; }
.props li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; margin: 0; padding: 8px 10px; background: var(--accent-soft); border-radius: 10px; }
.props b { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
.relrow { display: grid; grid-template-columns: 1fr; gap: 6px; align-items: center; }
@media (min-width: 640px) { .relrow { grid-template-columns: 1fr 190px; } }
select, input[type=text], textarea { font: inherit; font-size: calc(16px * var(--scale)); min-height: 46px; border: 2px solid var(--track); border-radius: 10px; padding: 8px 10px; background: #fff; color: var(--ink); max-width: 100%; }
textarea { width: 100%; min-height: 130px; line-height: 1.5; resize: vertical; }
input.gap { display: inline-block; min-height: 40px; padding: 4px 8px; margin: 0 3px; text-align: center; font-weight: 700; color: var(--navy); }
input.gap.good, select.good { border-color: var(--ok); background: var(--ok-soft); }
input.gap.bad, select.bad { border-color: var(--ko); background: var(--ko-soft); }
.gaptext { line-height: 2.4; }
.ordlist { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; counter-reset: o; }
.ordlist li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 0; }
.ordlist li.good { border-color: var(--ok); background: var(--ok-soft); }
.ordlist li.bad { border-color: var(--ko); background: var(--ko-soft); }
.ordlist li::before { counter-increment: o; content: counter(o); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; }
.mv { display: flex; gap: 6px; }
.mv button { font: inherit; font-weight: 800; min-width: 44px; min-height: 44px; border-radius: 10px; border: 2px solid var(--track); background: #fff; color: var(--navy); cursor: pointer; }
.mv button:hover { border-color: var(--accent); }
.qq { margin: 0 0 14px; }
.kw { margin: 6px 0 10px; }
.kw .lab { font-weight: 800; color: var(--navy); margin-right: 6px; }
.modele { background: var(--ok-soft); border: 2px solid var(--ok); border-radius: 12px; padding: 12px 16px; margin: 10px 0; }
.modele[hidden] { display: none; }
.modele h4 { margin: 0 0 6px; color: var(--ok); font-size: calc(16px * var(--scale)); }
.modele p:last-child { margin-bottom: 0; }
.self { margin: 8px 0 0; }
.self legend { font-weight: 800; color: var(--navy); }
.cl { list-style: none; padding: 0; margin: 6px 0 10px; }
.cl label { display: flex; gap: 10px; align-items: flex-start; min-height: 44px; padding: 6px 0; }
.cl input { width: 26px; height: 26px; flex: 0 0 auto; margin-top: 0; accent-color: var(--accent); }
.gridin { display: grid; gap: 6px; }
.hint { color: var(--navy-soft); font-size: calc(14.5px * var(--scale)); }

/* ---------- bilan ---------- */
.bilan table.dt td.num, .bilan table.dt th.num { text-align: center; white-space: nowrap; }
.bilan .syn { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 8px 0; background: #fff; white-space: pre-wrap; }
.idrow { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .idrow { grid-template-columns: repeat(3, 1fr); } }
.idrow label { display: block; font-weight: 700; color: var(--navy); }
.idrow input { width: 100%; }
.warn { background: var(--gold-soft); border: 2px solid var(--gold); border-radius: 12px; padding: 10px 14px; }

/* ---------- lightbox ---------- */
.lb { position: fixed; inset: 0; background: rgba(10,16,30,.92); z-index: 2000; display: none; flex-direction: column; }
.lb.open { display: flex; }
.lb-bar { display: flex; gap: 10px; padding: 10px 14px; justify-content: flex-end; }
.lb-bar button, .lb-bar a { font: inherit; font-weight: 800; min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 10px; border: 2px solid #fff; background: transparent; color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.lb-body { flex: 1; overflow: auto; padding: 0 14px 20px; text-align: center; -webkit-overflow-scrolling: touch; }
.lb-body img { max-width: none; width: 100%; max-width: 1400px; background: #fff; border-radius: 6px; }
.lb-body.fit img { width: auto; max-height: calc(100vh - 90px); max-width: 100%; }

.foot { max-width: 1180px; margin: 0 auto; padding: 10px 14px 40px; color: var(--navy-soft); font-size: calc(14px * var(--scale)); }

/* ---------- accessibilité ---------- */
body.a11y-font, body.a11y-font * { font-family: Verdana, Geneva, sans-serif !important; }
body.a11y-font { line-height: 1.85; letter-spacing: .02em; word-spacing: .08em; }
body.a11y-contrast { --bg: #FFFFFF; --ink: #000000; --line: #000000; --navy: #000A3A; --navy-soft: #1A1A1A; --track: #000000; --orange: #7A2600; --teal: #00473F; --violet: #3B1F72; --rose: #7D0F3A; --gold: #5A4210; --accent-soft: #FFFFFF; }
body.a11y-contrast .card, body.a11y-contrast .act, body.a11y-contrast .mcard, body.a11y-contrast fieldset.item { border-color: #000; }
body.a11y-contrast a { text-decoration: underline; }
body.a11y-contrast .hero { background: #000A3A; }
body.a11y-contrast .consigne, body.a11y-contrast .props li, body.a11y-contrast table.dt th { background: #EEE; }
body.a11y-contrast .essentiel, body.a11y-contrast .note, body.a11y-contrast .modele { background: #fff; border-color: #000; }
body.anim-off *, body.anim-off *::before, body.anim-off *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
/* Mode FALC (facile à lire et à comprendre) : texte plus grand, lignes plus courtes, plus d'espace, moins d'éléments décoratifs */

       "x": "<p>Conseiller d'une agence bancaire, vous constatez – en consultant les relevés de compte – que les époux Vasseur, mariés sous le régime de la communauté légale, ont fait l'objet de frais de relance de la part de la clinique privée Belmont pour plusieurs échéances impayées, d'un montant total de 6 500 €.</p><p>Cette somme correspond à une intervention de chirurgie esthétique (liposuccion) réalisée à la demande de Mme Vasseur seule, sans finalité thérapeutique, dont le contrat a été signé par elle seule. Les revenus mensuels du couple s'élèvent à environ 2 800 € au total.</p><p>Vous vous demandez vers qui la clinique pourrait se retourner — M. Vasseur, Mme Vasseur, ou les deux — pour obtenir le paiement des sommes dues.</p><p>Vous disposez des <u><b>annexes 1 et 2</b></u>.</p>",

       "html": "<p><b>Cour de cassation, 1re chambre civile, 17 décembre 2014, n° 13-25.117, publié au Bulletin</b></p><p><b>Faits :</b> Mme X est hospitalisée à l'Hôtel-Dieu en 2008. Les frais d'hospitalisation s'élèvent à 15 306,30 €. Cette somme demeurant impayée, l'Assistance Publique – Hôpitaux de Paris (AP-HP) assigne en paiement M. X, l'époux de la patiente, qui n'était pourtant pas partie aux soins.</p><p><b>Moyen invoqué par M. X :</b> il soutenait ne pas pouvoir être tenu au paiement d'une dette de santé contractée par son épouse seule, à laquelle il était resté étranger.</p><p><b>Solution de la Cour de cassation :</b> la Cour rejette le pourvoi. Elle retient que toute dette de santé contractée par un époux engage l'autre solidairement, sur le fondement de l'article 220 du Code civil, dès lors que cette dette ne relève d'aucune des exceptions prévues à l'alinéa 2 de ce texte (dépense manifestement excessive au regard du train de vie du ménage, de l'utilité ou de l'inutilité de l'opération, ou de la mauvaise foi du tiers contractant). M. X est en conséquence condamné au paiement de la somme réclamée par l'AP-HP.</p>",

       "titre": "Votre cas pratique",
       "consigne": "Rédigez votre cas pratique en suivant les consignes de rédaction : rappel des faits qualifiés juridiquement et énoncé du problème de droit, puis « On sait que », « Or, en l'espèce » et « Donc ».",
       "lignes": 16,
       "modele": "<p><u><b>1. Qualification juridique des faits</b></u></p><p>M. et Mme Vasseur sont mariés sous le régime de la communauté légale. Mme Vasseur a, seule, conclu avec la clinique privée Belmont un contrat portant sur une intervention de chirurgie esthétique (liposuccion), dépourvue de toute finalité thérapeutique, d'un coût de 6 500 €. Plusieurs échéances restant impayées, la clinique cherche à en obtenir le règlement et s'interroge sur la personne — M. Vasseur, Mme Vasseur, ou les deux — contre laquelle elle peut agir.</p><p>Il s'agit donc d'une dette de santé, contractée par un seul époux, dont il convient de déterminer si elle engage également l'époux qui n'y est pas intervenu.</p><p><u><b>2. Problème de droit</b></u></p><p>Une dette de santé contractée par un seul époux engage-t-elle solidairement l'autre époux lorsque l'acte médical en cause, dépourvu de nécessité thérapeutique, présente un coût manifestement disproportionné au regard des ressources du ménage ?</p><p><u><b>3. Majeure — On sait que…</b></u></p><p>On sait que l'article 220 du Code civil dispose que chacun des époux a le pouvoir de passer seul les contrats ayant pour objet l'entretien du ménage, une telle dette obligeant alors solidairement l'autre époux (Annexe 1). La Cour de cassation a précisé le champ de cette disposition en y intégrant les dépenses de santé : dans un arrêt du 17 décembre 2014, elle a jugé que toute dette de santé contractée par un époux engage l'autre solidairement sur le fondement de l'article 220 (Annexe 2).</p><p>On sait cependant que ce principe de solidarité connaît une exception : en application du second alinéa de l'article 220, la solidarité est écartée lorsque la dépense est manifestement excessive, ce caractère s'appréciant au regard de trois critères cumulatifs — le train de vie du ménage, l'utilité ou l'inutilité de l'opération, et la bonne ou mauvaise foi du tiers contractant. C'est d'ailleurs faute pour cette exception d'être caractérisée que la Cour de cassation a maintenu la solidarité dans son arrêt du 17 décembre 2014, les frais d'hospitalisation en cause répondant à un besoin de soins nécessaire et n'excédant pas les capacités du ménage.</p><p><u><b>4. Mineure — Or, en l'espèce…</b></u></p><p>Or, en l'espèce, la situation se distingue de celle jugée par la Cour de cassation en 2014. D'une part, l'intervention pratiquée sur Mme Vasseur est un acte de confort, sans nécessité thérapeutique : à la différence de soins hospitaliers indispensables, cette opération répond à une pure convenance personnelle, ce qui caractérise l'inutilité de l'opération au sens de l'article 220 alinéa 2. D'autre part, son coût, 6 500 €, représente plus de deux mois de revenus du ménage, dont les ressources mensuelles s'élèvent à environ 2 800 € : ce montant est manifestement disproportionné au regard du train de vie du couple.</p><p>Ces deux critères — inutilité de l'opération et disproportion au regard du train de vie du ménage — étant réunis, la dépense engagée par Mme Vasseur doit être qualifiée de manifestement excessive.</p><p><u><b>5. Conclusion — Donc…</b></u></p><p>Donc, la dépense étant manifestement excessive au sens de l'article 220 alinéa 2 du Code civil, l'exception à la solidarité s'applique : M. Vasseur, qui n'est pas intervenu au contrat, ne peut être tenu au paiement de cette dette envers la clinique Belmont. Seule Mme Vasseur, en sa qualité de signataire, demeure personnellement engagée et devra répondre du paiement des sommes dues sur son patrimoine propre.</p>",

<script>
/* Sauvegarde locale (navigateur) et petits outils. Rien n'est envoyé sur internet. */
(function () {
  'use strict';
  var KEY = 'lms-bts-cas-pratique-v1';
  var mem = null;

  function defaults() {
    return {
      v: 1,
      id: { prenom: '', nom: '', classe: '' },
      a11y: { font: false, contrast: false, falc: false, read: false, anim: false, size: 0 },
      steps: {},   // "s1/2": true quand l'étape est terminée
      blocks: {},  // état de chaque activité
      badges: null, // badges déjà annoncés (null = pas encore initialisé)
      xp: null, // XP : meilleur nombre de bonnes réponses par exercice (null = pas encore initialisé)
      time: null // temps actif passé (en secondes) par module (m1, m2…), diagnostic (diag) et quiz (quiz)
    };
  }
  function load() {
    try {
      var r = window.localStorage.getItem(KEY);
      if (r) {
        var o = JSON.parse(r), d = defaults();
        for (var k in d) if (!(k in o)) o[k] = d[k];
        return o;
      }
    } catch (e) { /* stockage indisponible : on travaille en mémoire */ }
    return defaults();
  }
  var S = load();
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { mem = JSON.stringify(S); }
    if (typeof Store.onSave === 'function') setTimeout(Store.onSave, 0);
  }

  var Store = {
    get S() { return S; },
    save: save,
    block: function (id) { return S.blocks[id] || (S.blocks[id] = {}); },
    reset: function () { S = defaults(); save(); },
    exportJSON: function () { return JSON.stringify(S); },
    importJSON: function (txt) {
      var o = JSON.parse(txt);
      if (!o || o.v !== 1 || typeof o.blocks !== 'object') throw new Error('Fichier non reconnu');
      var d = defaults();
      for (var k in d) if (!(k in o)) o[k] = d[k];
      S = o; save();
    }
  };

  /* ---------- outils ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  // création d'éléments : h('div', {class:'x', html:'<b>..</b>'}, enfants...)
  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v === false || v == null) continue;
      if (k === 'html') e.innerHTML = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else e.setAttribute(k, v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
      else e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return e;
  }
  // normalisation pour comparer des réponses libres (accents, casse, ponctuation)
  function norm(s) {
    return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[’']/g, "'").replace(/œ/g, 'oe').replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  // mélange reproductible (même ordre à chaque visite)
  function shuffle(arr, seed) {
    var a = arr.slice(), s = 0, i;
    for (i = 0; i < String(seed).length; i++) s = (s * 31 + String(seed).charCodeAt(i)) >>> 0;
    function rnd() { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }
    for (i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  window.Store = Store;
  window.U = { esc: esc, h: h, norm: norm, shuffle: shuffle };
})();

<script>
/* Blocs de contenu et activités corrigées automatiquement. */
(function () {
  'use strict';
  var h = U.h, esc = U.esc, norm = U.norm, shuffle = U.shuffle;
  var AUTO = { vf: 1, relier: 1, trous: 1, ordre: 1, tri: 1, qcm: 1 };
  var OPEN = { ouvert: 1, tableau: 1, fait: 1 };
  var LETTERS = 'abcdefghij';
  var MIN_MOTS_SYNTHESE = 15;   // nombre minimal de mots pour pouvoir valider une synthèse

  function isInteractive(b) { return !!(AUTO[b.t] || OPEN[b.t] || b.t === 'ipsative'); }
  function isDone(b) {
    if (b.t === 'ipsative') return !!(Store.S.blocks['diag2'] || {}).chk;
    var st = Store.S.blocks[b.id] || {};
    if (AUTO[b.t]) return !!st.chk;
    if (OPEN[b.t]) return !!st.rev;
    return true;
  }
  // score automatique d'un bloc (null si non noté)
  function scoreOf(b) {
    if (!AUTO[b.t]) return null;
    var st = Store.S.blocks[b.id];
    if (!st || !st.chk) return null;
    return { sc: st.sc || 0, mx: st.mx || 0 };
  }
  function collect(blocks, fn) {
    (blocks || []).forEach(function (b) {
      fn(b);
      if (b.blocks) collect(b.blocks, fn);
    });
  }

  function head(b) {
    var out = [];
    if (b.titre) out.push(h('h3', { text: b.titre }));
    if (b.consigne) out.push(h('p', { class: 'consigne', html: b.consigne }));
    return out;
  }
  function resEl() { return h('p', { class: 'res', role: 'status', 'aria-live': 'polite' }); }
  function setRes(el, sc, mx) {
    el.className = 'res ' + (sc === mx ? 'ok' : 'part');
    el.textContent = 'Résultat : ' + sc + ' / ' + mx + (sc === mx ? ' — bravo !' : ' — lisez les corrections ci-dessus, puis recommencez si vous le souhaitez.');
    reveal(el);
  }
  /* clic de l'élève : le résultat qui s'affiche est ramené à l'écran (pas au chargement de la page) */
  var userAct = false;
  document.addEventListener('click', function (e) {
    if (e.target && e.target.closest && e.target.closest('button')) { userAct = true; setTimeout(function () { userAct = false; }, 0); }
  }, true);
  function reveal(el) { if (userAct) { try { el.scrollIntoView({ block: 'nearest', behavior: 'auto' }); } catch (e) { } } }
  function flag(el) {
    if (!el) return;
    el.classList.add('todo'); setTimeout(function () { el.classList.remove('todo'); }, 4500);
    try { el.scrollIntoView({ block: 'center', behavior: 'auto' }); } catch (e) { }
  }
  function missing(n, test) { var m = []; for (var i = 0; i < n; i++) if (!test(i)) m.push(i); return m; }
  function reste(m, one, many) { return 'Il reste ' + m.length + ' ' + (m.length > 1 ? many : one) + ' sans réponse : la première est entourée en orange.'; }
  function warn(el, msg, target) { el.className = 'res part'; el.textContent = msg; flag(target); }
  function tryAgain(b, st, box, rerender) {
    return h('button', { type: 'button', class: 'btn sec', onclick: function () {
      var keep = st.t; Store.S.blocks[b.id] = {}; Store.save(); rerender(); } }, 'Recommencer');
  }

  /* ---------- Vrai / Faux ---------- */
  function vf(b) {
    var st = Store.block(b.id); if (!st.a) st.a = [];
    var opts = [['v', 'Vrai'], ['f', 'Faux']]; if (b.ns) opts.push(['n', 'Je ne sais pas']);
    var box = h('section', { class: 'bloc act', 'data-bid': b.id });
    head(b).forEach(function (x) { box.appendChild(x); });
    var rows = [];
    b.items.forEach(function (it, i) {
      var fs = h('fieldset', { class: 'item' }, h('legend', { text: (i + 1) + '. ' + it.q }));
      var ch = h('div', { class: 'choices' });
      opts.forEach(function (o) {
        var inp = h('input', { type: 'radio', name: b.id + '-' + i, value: o[0] });
        if (st.a[i] === o[0]) inp.checked = true;
        inp.addEventListener('change', function () { st.a[i] = o[0]; Store.save(); });
        ch.appendChild(h('label', null, inp, h('span', { text: o[1] })));
      });
      var fb = h('p', { class: 'fb', hidden: true });
      fs.appendChild(ch); fs.appendChild(fb); box.appendChild(fs);
      rows.push({ fs: fs, fb: fb, ch: ch });
    });
    var res = resEl();
    function paint() {
      var sc = 0;
      b.items.forEach(function (it, i) {
        var good = (it.a ? 'v' : 'f') === st.a[i];
        if (good) sc++;
        var r = rows[i];
        r.fs.className = 'item ' + (good ? 'good' : 'bad');
        r.fb.hidden = false; r.fb.className = 'fb ' + (good ? 'g' : 'b');
        r.fb.innerHTML = (good ? '✔ Bonne réponse. ' : '✘ La bonne réponse est : ' + (it.a ? 'Vrai' : 'Faux') + '. ') +
          (it.e ? '<span class="ex">' + it.e + '</span>' : '');
        [].forEach.call(r.ch.querySelectorAll('input'), function (i2) { i2.disabled = true; });
      });
      st.sc = sc; st.mx = b.items.length; setRes(res, sc, st.mx);
    }
    var bc = h('button', { type: 'button', class: 'btn', onclick: function () {
      var mq = missing(b.items.length, function (i) { return !!st.a[i]; });
      if (mq.length) { warn(res, reste(mq, 'affirmation', 'affirmations'), rows[mq[0]].fs); return; }
      st.chk = true; Store.save(); paint(); bc.hidden = true; br.hidden = false;
      document.dispatchEvent(new CustomEvent('lms-checked', { detail: b.id }));
    } }, 'Vérifier mes réponses');
    var br = tryAgain(b, st, box, function () { box.replaceWith(vf(b)); document.dispatchEvent(new CustomEvent('lms-checked', { detail: b.id })); });
    br.hidden = true;
    box.appendChild(h('div', { class: 'btns' }, bc, br)); box.appendChild(res);
    if (st.chk) { paint(); bc.hidden = true; br.hidden = false; }
    return box;
  }

  /* ---------- Relier : on touche un élément, puis sa proposition ; un trait se trace ---------- */
  var LINK_COLORS = ['#1F3864', '#C2410C', '#12796B', '#5E3E96', '#B4235A', '#8A6A32'];
  var SVGNS = 'http://www.w3.org/2000/svg';
  function relier(b) {
    var st = Store.block(b.id); if (!st.a) st.a = [];
    var keys = Object.keys(b.props), n = b.items.length;
    var box = h('section', { class: 'bloc act relier', 'data-bid': b.id });
    head(b).forEach(function (x) { box.appendChild(x); });
    box.appendChild(h('p', { class: 'hint', text: 'Touchez (ou cliquez sur) un élément à gauche, puis la proposition qui lui correspond à droite : un trait les relie. Pour changer un lien, touchez à nouveau l\'élément déjà relié.' }));
    var zone = h('div', { class: 'rl', role: 'group', 'aria-label': 'Éléments à relier à leurs propositions' });
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('class', 'rl-svg'); svg.setAttribute('aria-hidden', 'true'); svg.setAttribute('focusable', 'false');
    var left = h('ul', { class: 'rl-col' }), right = h('ul', { class: 'rl-col' });
    var bi = [], bp = {}, sel = null, locked = !!st.chk;
    var live = h('p', { class: 'sr', role: 'status', 'aria-live': 'polite' });
    function say(t) { live.textContent = t; }
    function colorOf(i) { return LINK_COLORS[i % LINK_COLORS.length]; }
    function ownerOf(k) { for (var i = 0; i < n; i++) if (st.a[i] === k) return i; return -1; }

    b.items.forEach(function (it, i) {
      var tag = h('span', { class: 'rl-tag', 'aria-hidden': 'true' }), sr = h('span', { class: 'sr' });
      var btn = h('button', { type: 'button', class: 'rl-b', 'aria-pressed': 'false' },
        h('span', { class: 'rl-n', text: String(i + 1) }), h('span', { class: 'rl-t', html: it.q }), tag, sr);
      btn.addEventListener('click', function () { pick('i', i); });
      bi.push({ btn: btn, tag: tag, sr: sr }); left.appendChild(h('li', null, btn));
    });
    keys.forEach(function (k) {
      var tag = h('span', { class: 'rl-tag', 'aria-hidden': 'true' }), sr = h('span', { class: 'sr' });
      var btn = h('button', { type: 'button', class: 'rl-b', 'aria-pressed': 'false' },
        h('span', { class: 'rl-n', text: k }), h('span', { class: 'rl-t', html: b.props[k] }), tag, sr);
      btn.addEventListener('click', function () { pick('p', k); });
      bp[k] = { btn: btn, tag: tag, sr: sr }; right.appendChild(h('li', null, btn));
    });
    zone.appendChild(svg); zone.appendChild(left); zone.appendChild(right);
    box.appendChild(zone); box.appendChild(live);

    function pick(side, id) {
      if (locked) return;
      if (sel && sel.side !== side) {                       // 2e clic, dans l'autre colonne : on relie
        var i = side === 'i' ? id : sel.id, k = side === 'p' ? id : sel.id, o = ownerOf(k);
        if (o >= 0) st.a[o] = '';
        st.a[i] = k; sel = null; Store.save();
        say('Élément ' + (i + 1) + ' relié à la proposition ' + k + '.'); update(); return;
      }
      if (sel && sel.side === side && sel.id === id) { sel = null; update(); return; }   // on annule la sélection
      if (side === 'i' && st.a[id]) { st.a[id] = ''; Store.save(); say('Lien défait. Choisissez la proposition de l\'élément ' + (id + 1) + '.'); }
      else if (side === 'p' && ownerOf(id) >= 0) { st.a[ownerOf(id)] = ''; Store.save(); say('Lien défait. Choisissez l\'élément de la proposition ' + id + '.'); }
      else say(side === 'i' ? 'Élément ' + (id + 1) + ' sélectionné : choisissez sa proposition.' : 'Proposition ' + id + ' sélectionnée : choisissez son élément.');
      sel = { side: side, id: id }; update();
    }
    function update() {
      bi.forEach(function (o, i) {
        var k = st.a[i], on = sel && sel.side === 'i' && sel.id === i;
        o.btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        o.btn.classList.toggle('sel', !!on); o.btn.classList.toggle('linked', !!k);
        if (k) o.btn.style.setProperty('--lc', colorOf(i)); else o.btn.style.removeProperty('--lc');
        o.tag.textContent = k || '';
        o.sr.textContent = k ? ' Relié à la proposition ' + k + '.' : ' Pas encore relié.';
      });
      keys.forEach(function (k) {
        var o = bp[k], w = ownerOf(k), on = sel && sel.side === 'p' && sel.id === k;
        o.btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        o.btn.classList.toggle('sel', !!on); o.btn.classList.toggle('linked', w >= 0);
        if (w >= 0) o.btn.style.setProperty('--lc', colorOf(w)); else o.btn.style.removeProperty('--lc');
        o.tag.textContent = w >= 0 ? String(w + 1) : '';
        o.sr.textContent = w >= 0 ? ' Reliée à l\'élément ' + (w + 1) + '.' : ' Pas encore reliée.';
      });
      draw();
    }
    function line(tag, attrs) { var e = document.createElementNS(SVGNS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
    function draw() {
      var zr = zone.getBoundingClientRect();
      if (!zr.width) return;
      svg.setAttribute('width', zr.width); svg.setAttribute('height', zr.height); svg.setAttribute('viewBox', '0 0 ' + zr.width + ' ' + zr.height);
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      for (var i = 0; i < n; i++) {
        var k = st.a[i]; if (!k || !bp[k]) continue;
        var a = bi[i].btn.getBoundingClientRect(), p = bp[k].btn.getBoundingClientRect();
        var x1 = a.right - zr.left, y1 = a.top + a.height / 2 - zr.top, x2 = p.left - zr.left, y2 = p.top + p.height / 2 - zr.top;
        var cls = st.chk ? (k === b.items[i].a ? ' good' : ' bad') : '', col = colorOf(i);
        // trait « en coude » : chaque lien a son propre couloir vertical, pour que les traits ne se superposent pas
        var gw = x2 - x1, xm = x1 + gw * (i + 1) / (n + 1), dy = y2 - y1, sg = dy > 0 ? 1 : -1;
        var r = Math.max(0, Math.min(9, Math.abs(dy) / 2, gw / (n + 1) * 0.9));
        var d = Math.abs(dy) < 1 ? 'M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2
          : 'M' + x1 + ' ' + y1 + ' H' + (xm - r) + ' Q' + xm + ' ' + y1 + ' ' + xm + ' ' + (y1 + sg * r) + ' V' + (y2 - sg * r) + ' Q' + xm + ' ' + y2 + ' ' + (xm + r) + ' ' + y2 + ' H' + x2;
        svg.appendChild(line('path', { 'class': 'rl-line' + cls, stroke: col, d: d }));
        svg.appendChild(line('circle', { 'class': 'rl-dot' + cls, fill: col, cx: x1, cy: y1, r: 5 }));
        svg.appendChild(line('circle', { 'class': 'rl-dot' + cls, fill: col, cx: x2, cy: y2, r: 5 }));
      }
    }
    if (window.ResizeObserver) new ResizeObserver(function () { draw(); }).observe(zone);
    window.addEventListener('resize', draw);
    window.addEventListener('load', draw);

    var res = resEl(), fbl = h('div', { class: 'rl-fb' });
    function paint() {
      locked = true; zone.classList.add('locked');
      var sc = 0; fbl.innerHTML = '';
      b.items.forEach(function (it, i) {
        var good = st.a[i] === it.a; if (good) sc++;
        var cls = good ? 'good' : 'bad';
        bi[i].btn.classList.add(cls); bi[i].btn.setAttribute('aria-disabled', 'true');
        if (bp[st.a[i]]) { bp[st.a[i]].btn.classList.add(cls); bp[st.a[i]].btn.setAttribute('aria-disabled', 'true'); }
        fbl.appendChild(h('p', { class: 'fb ' + (good ? 'g' : 'b'), html: '<b>' + (i + 1) + '.</b> ' + (good ? '✔ Bonne réponse (proposition ' + it.a + ').' : '✘ Vous l\'avez relié à la proposition ' + esc(st.a[i]) + ' ; la bonne proposition est <b>' + it.a + '</b>.') }));
      });
      st.sc = sc; st.mx = n; setRes(res, sc, n); draw();
    }
    var bc = h('button', { type: 'button', class: 'btn', onclick: function () {
      var mq = missing(n, function (i) { return !!st.a[i]; });
      if (mq.length) { warn(res, 'Il reste ' + mq.length + ' élément' + (mq.length > 1 ? 's' : '') + ' à relier : le premier est entouré en orange.', bi[mq[0]].btn); return; }
      sel = null; st.chk = true; Store.save(); update(); paint(); bc.hidden = true; bx.hidden = true; br.hidden = false;
    } }, 'Vérifier mes réponses');
    var bx = h('button', { type: 'button', class: 'btn sec', onclick: function () {
      st.a = []; sel = null; Store.save(); res.textContent = ''; say('Tous les liens sont effacés.'); update();
    } }, 'Tout effacer');
    var br = tryAgain(b, st, box, function () { box.replaceWith(relier(b)); }); br.hidden = true;
    box.appendChild(h('div', { class: 'btns' }, bc, bx, br)); box.appendChild(res); box.appendChild(fbl);
    update();
    if (st.chk) { paint(); bc.hidden = true; bx.hidden = true; br.hidden = false; }
    requestAnimationFrame(draw);
    return box;
  }

  /* ---------- Textes à trous ---------- */
  function trous(b) {
    var st = Store.block(b.id); if (!st.a) st.a = [];
    var box = h('section', { class: 'bloc act', 'data-bid': b.id });
    head(b).forEach(function (x) { box.appendChild(x); });
    var re = /\[\[(.+?)\]\]/g, last = 0, m, k = 0, inputs = [], answers = [];
    var wrap = h('p', { class: 'gaptext' });
    function pushHtml(t) { if (t) wrap.appendChild(h('span', { html: t })); }
    while ((m = re.exec(b.texte))) {
      pushHtml(b.texte.slice(last, m.index));
      var alts = m[1].split('|'); answers.push(alts);
      var idx = k++;
      var inp = h('input', { type: 'text', class: 'gap', size: Math.max(5, alts[0].length + 2), 'aria-label': 'Mot manquant n°' + (idx + 1), autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
      inp.value = st.a[idx] || '';
      inp.addEventListener('input', function (i) { return function (e) { st.a[i] = e.target.value; Store.save(); }; }(idx));
      wrap.appendChild(inp); inputs.push(inp); last = m.index + m[0].length;
    }
    pushHtml(b.texte.slice(last));
    box.appendChild(wrap);
    var fb = h('p', { class: 'fb', hidden: true }), res = resEl();
    function paint() {
      var sc = 0, wrong = [];
      inputs.forEach(function (inp, i) {
        var ok = answers[i].some(function (a) { return norm(a) === norm(st.a[i]); });
        if (ok) sc++; else wrong.push((i + 1) + ') ' + answers[i][0]);
        inp.className = 'gap ' + (ok ? 'good' : 'bad'); inp.readOnly = true;
      });
      st.sc = sc; st.mx = inputs.length;
      if (wrong.length) { fb.hidden = false; fb.className = 'fb b'; fb.innerHTML = '✘ À corriger : <span class="ex">' + esc(wrong.join(' ; ')) + '</span>'; }
      else { fb.hidden = false; fb.className = 'fb g'; fb.textContent = '✔ Tous les mots sont justes.'; }
      setRes(res, sc, st.mx);
    }
    var bc = h('button', { type: 'button', class: 'btn', onclick: function () {
      var mq = missing(inputs.length, function (i) { return !!norm(st.a[i]); });
      if (mq.length) { warn(res, 'Il reste ' + mq.length + ' trou' + (mq.length > 1 ? 's' : '') + ' à compléter : le premier est entouré en orange.', inputs[mq[0]]); return; }
      st.chk = true; Store.save(); paint(); bc.hidden = true; br.hidden = false;
    } }, 'Vérifier');
    var br = tryAgain(b, st, box, function () { box.replaceWith(trous(b)); }); br.hidden = true;
    box.appendChild(fb); box.appendChild(h('div', { class: 'btns' }, bc, br)); box.appendChild(res);
    if (st.chk) { paint(); bc.hidden = true; br.hidden = false; }
    return box;
  }

  /* ---------- Classer dans l'ordre ---------- */
  function ordre(b) {
    var st = Store.block(b.id);
    var n = b.items.length;
    if (!st.o) {
      var o = shuffle(b.items.map(function (_, i) { return i; }), b.id);
      var sorted = o.every(function (v, i) { return v === i; });
      if (sorted) o = o.slice(1).concat(o[0]);
      st.o = o; Store.save();
    }
    var box = h('section', { class: 'bloc act', 'data-bid': b.id });
    head(b).forEach(function (x) { box.appendChild(x); });
    var ul = h('ol', { class: 'ordlist' });
    var res = resEl(), fb = h('p', { class: 'fb', hidden: true });
    function draw(focusIdx, focusDir) {

      msg.textContent = 'Il reste ' + left.length + ' activité' + (left.length > 1 ? 's' : '') + ' à terminer sur cette page avant de passer à la suite : la première est entourée en orange. Vérifiez vos réponses, validez votre composition ou comparez avec la réponse attendue, selon l\'activité.';
      var id = left[0].t === 'ipsative' ? 'diag2' : left[0].id, el = id ? c.querySelector('[data-bid="' + id + '"]') : null;
      if (el) {
        el.classList.add('todo'); setTimeout(function () { el.classList.remove('todo'); }, 4500);
        try { el.scrollIntoView({ block: 'center', behavior: 'auto' }); } catch (e) { }
      }
    }
    var nx = k < total ? { href: '#/m/' + m.n + '/' + (k + 1), label: 'Étape suivante →' }
      : (mod(m.n + 1) ? { href: '#/m/' + (m.n + 1), label: mod(m.n + 1).lib + ' →' } : { href: '#/quiz', label: 'Quiz final →' });
    function paintNext() {
      nextSlot.innerHTML = '';
      if (stepDone(m.n, k)) nextSlot.appendChild(h('a', { class: 'btn', href: nx.href }, nx.label));
      else nextSlot.appendChild(h('button', { type: 'button', class: 'btn locked', 'aria-disabled': 'true', onclick: function () {
        var left = remaining();
        if (left.length) showRemaining(left);
        else { msg.className = 'res part'; msg.textContent = 'Cliquez d\'abord sur « J\'ai terminé cette étape » pour débloquer la suite.'; }
      } }, '🔒 ' + nx.label));
    }
    function paintBtn() {
      var d = stepDone(m.n, k);
      btn.textContent = d ? '✓ Étape terminée' : '✔ J\'ai terminé cette étape';
      btn.className = d ? 'btn sec' : 'btn'; btn.disabled = d;
      paintNext();
    }
    var arc = L.meta.arcade ? h('p', { class: 'res ok', role: 'status' }, '🎮 Vous avez terminé le parcours : l\'Arcade de Mnémosia est débloquée. ',
      h('a', { href: L.meta.arcade, target: '_blank', rel: 'noopener' }, 'Ouvrir l\'Arcade ↗'), ' (elle est aussi sur la page d\'accueil).') : h('p', { hidden: true });
    var lastStep = m.n === L.modules.length && k === total;
    function paintArc() { arc.hidden = !(L.meta.arcade && lastStep && courseDone()); }
    btn.addEventListener('click', function () {
      if (stepDone(m.n, k)) return;
      var left = remaining();
      if (left.length) { showRemaining(left); return; }
      Store.S.steps[key(m.n, k)] = true; Store.save(); paintBtn(); paintBar(); buildNav(); paintArc();
      msg.className = 'res ok'; msg.textContent = '✔ Étape terminée : vous pouvez passer à la suite.';
    });
    paintBtn(); paintArc();
    c.appendChild(h('div', { class: 'btns noprint' }, btn)); c.appendChild(msg); c.appendChild(arc);

    var prev;
    if (k > 1) prev = h('a', { class: 'btn sec', href: '#/m/' + m.n + '/' + (k - 1) }, '← Étape précédente');
    else prev = h('a', { class: 'btn sec', href: '#/m/' + m.n }, '← ' + m.lib);
    c.appendChild(h('div', { class: 'stepnav' }, prev, nextSlot));
    wrap.appendChild(c);
    return [wrap];
  }
  /* ---------- vue : quiz final ---------- */
  function viewQuiz() {
    var c = card('mq');
    c.appendChild(h('p', { class: 'kicker', text: 'Pour finir' }));
    c.appendChild(h('h1', { text: L.quiz.titre }));
    c.appendChild(h('p', { class: 'lead', html: L.quiz.intro }));
    L.quiz.blocks.forEach(function (b) { c.appendChild(Blocks.render(b)); });
    c.appendChild(h('div', { class: 'stepnav' }, h('a', { class: 'btn sec', href: '#/m/' + L.modules.length }, '← ' + L.modules[L.modules.length - 1].lib), h('a', { class: 'btn', href: '#/bilan' }, 'Mon bilan →')));
    return [c];
  }

  /* ---------- vue : mes badges ---------- */
  function viewBadges() {
    var list = badgeList(), n = badgeCount();
    var c = card('mq');
    c.appendChild(h('p', { class: 'kicker', text: 'Pour progresser en s\'amusant' }));
    c.appendChild(h('h1', { text: 'Mes badges' }));
    c.appendChild(h('p', { class: 'lead', text: L.meta.badgesIntro || '' }));
    var pct = list.length ? Math.round(100 * n / list.length) : 0;
    c.appendChild(h('p', null, h('b', { text: n + ' badge' + (n > 1 ? 's' : '') + ' sur ' + list.length })));
    c.appendChild(h('div', { class: 'prog', role: 'img', 'aria-label': pct + ' % des badges obtenus' }, h('i', { style: 'width:' + pct + '%' })));
    var groups = [];
    list.forEach(function (b) { if (groups.indexOf(b.g) < 0) groups.push(b.g); });
    groups.forEach(function (g) {
      c.appendChild(h('h2', { text: g }));
      c.appendChild(h('ul', { class: 'bdgs' }, list.filter(function (b) { return b.g === g; }).map(function (b) {
        var on = hasBadge(b);
        return h('li', { class: 'bdg ' + (on ? 'on' : 'off') + ((b.type === 'module' || b.type === 'maitrise') ? ' m' + b.n : '') },
          h('span', { class: 'bd-ic', 'aria-hidden': 'true', text: b.ico }),
          h('div', { class: 'bd-tx' }, h('h3', { text: b.titre }), h('p', { text: b.cond }),
            h('p', { class: 'bd-st' }, on ? '✔ Obtenu' : '🔒 À débloquer')));
      })));
    });
    c.appendChild(h('div', { class: 'stepnav' }, h('a', { class: 'btn sec', href: '#/' }, 'Accueil'), h('a', { class: 'btn', href: nextHref() }, nextLabel())));
    return [c];
  }

  /* ---------- vue : bilan ---------- */
  function bilanText() {
    var id = Store.S.id, lines = [];
    var who = [id.prenom, id.nom].filter(Boolean).join(' ') || '(nom non renseigné)';
    lines.push('BILAN — ' + L.meta.titre + ' (' + L.meta.sous + ')');
    lines.push('Apprenant(e) : ' + who + (id.classe ? ' · Classe : ' + id.classe : ''));
    lines.push('Date : ' + new Date().toLocaleDateString('fr-FR'));
    lines.push('');
    var dd = blockScore('diag'), qq = blockScore('quiz');
    lines.push(L.diag.titre + ' : ' + (dd ? scoreTxt(dd) : 'non fait'));
    L.modules.forEach(function (m) { var p = modProg(m), s = modScore(m); lines.push(m.lib + ' — ' + m.titre + ' : ' + p.done + '/' + p.total + ' étapes terminées ; exercices corrigés : ' + scoreTxt(s)); });
    var d2 = blockScore('diag2'); lines.push('Diagnostic refait à la fin : ' + (d2 ? scoreTxt(d2) : 'non fait'));
    lines.push('Quiz final : ' + (qq ? scoreTxt(qq) : 'non fait'));
    lines.push(xpBilanLine());
    if (badgeList().length) lines.push('Badges obtenus : ' + badgeCount() + ' / ' + badgeList().length + (badgeCount() ? ' (' + badgeList().filter(hasBadge).map(function (b) { return b.titre; }).join(' ; ') + ')' : ''));
    var qm = quizMods();
    if (qm) Object.keys(qm).sort().forEach(function (n) { var o = qm[n]; lines.push('   Quiz final, ' + Blocks.modLabel(+n) + ' : ' + o.sc + ' / ' + o.mx + ' (' + Blocks.level(o.sc, o.mx).t.replace(/^\S+\s/, '') + ')'); });
    tpsLines().forEach(function (l) { lines.push(l); });
    lines.push('');
    lines.push('MES COMPOSITIONS RÉDIGÉES');
    synthBlocks().forEach(function (x) {
      var st = Store.S.blocks[x.b.id] || {};
      lines.push(''); lines.push('— ' + x.label + (st.self ? ' [auto-évaluation : ' + ({ ok: 'conforme', part: 'en partie', rev: 'à revoir' })[st.self] + ']' : ''));
      lines.push(st.t && st.t.trim() ? st.t.trim() : '(non rédigée)');
    });
    return lines.join('\n');
  }
  function synthBlocks() {
    var out = [];
    L.modules.forEach(function (m) {
      m.steps.forEach(function (s, i) {
        allBlocks(s.blocks).forEach(function (b) { if (b.t === 'ouvert' && b.bilan) out.push({ b: b, label: m.lib + ' · ' + (b.bilan === true ? s.titre : b.bilan) }); });
      });
    });
    return out;
  }
  function download(name, text, type) {
    try {
      var blob = new Blob([text], { type: type || 'text/plain;charset=utf-8' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    } catch (e) { alert('Le téléchargement n\'est pas possible sur ce navigateur.'); }
  }
  function copyText(text, done) {
    function fb() { var ta = h('textarea', { style: 'position:fixed;left:-9999px' }); ta.value = text; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) { } ta.remove(); done(ok); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fb); else fb();
  }
  function viewBilan() {
    var c = card('mq bilan');
    c.appendChild(h('p', { class: 'kicker', text: 'À rendre à votre enseignant' }));
    c.appendChild(h('h1', { text: 'Mon bilan' }));
    c.appendChild(h('p', { class: 'lead', html: L.meta.bilanIntro }));
    var id = Store.S.id;
    var row = h('div', { class: 'idrow' });
    [['prenom', 'Prénom'], ['nom', 'Nom'], ['classe', 'Classe']].forEach(function (f) {
      var inp = h('input', { type: 'text', id: 'id-' + f[0], autocomplete: f[0] === 'classe' ? 'off' : (f[0] === 'prenom' ? 'given-name' : 'family-name') });
      inp.value = id[f[0]] || '';
      inp.addEventListener('input', function () { Store.S.id[f[0]] = inp.value; Store.save(); fillPrintId(); });
      row.appendChild(h('div', null, h('label', { for: 'id-' + f[0], text: f[1] }), inp));
    });
    c.appendChild(row);
    var pid = h('p', { class: 'syn', style: 'display:none', id: 'printId' });
    function fillPrintId() { pid.textContent = 'Apprenant(e) : ' + ([Store.S.id.prenom, Store.S.id.nom].filter(Boolean).join(' ') || '…') + (Store.S.id.classe ? ' · Classe : ' + Store.S.id.classe : '') + ' · ' + new Date().toLocaleDateString('fr-FR'); }
    fillPrintId(); c.appendChild(pid);

    c.appendChild(h('h2', { text: 'Mon parcours' }));
    var rows = [];
    var dd = blockScore('diag');
    rows.push(h('tr', null, h('th', { scope: 'row', text: L.diag.titre }), h('td', { class: 'num', text: dd ? 'Fait' : '—' }), h('td', { class: 'num', text: dd ? scoreTxt(dd) : '—' })));
    L.modules.forEach(function (m) {
      var p = modProg(m), s = modScore(m);
      rows.push(h('tr', null, h('th', { scope: 'row', text: m.lib + ' — ' + m.titre }), h('td', { class: 'num', text: p.done + ' / ' + p.total }), h('td', { class: 'num', text: scoreTxt(s) })));
    });
    var d2 = blockScore('diag2'), qq = blockScore('quiz');
    rows.push(h('tr', null, h('th', { scope: 'row', text: 'Diagnostic refait à la fin' }), h('td', { class: 'num', text: d2 ? 'Fait' : '—' }), h('td', { class: 'num', text: d2 ? scoreTxt(d2) : '—' })));
    rows.push(h('tr', null, h('th', { scope: 'row', text: 'Quiz final' }), h('td', { class: 'num', text: qq ? 'Fait' : '—' }), h('td', { class: 'num', text: qq ? scoreTxt(qq) : '—' })));
    var qm = quizMods();
    if (qm) Object.keys(qm).sort().forEach(function (n) {
      var o = qm[n];
      rows.push(h('tr', { class: 'sub' }, h('th', { scope: 'row', text: 'Quiz final · ' + Blocks.modLabel(+n) + ' (' + Blocks.level(o.sc, o.mx).t + ')' }), h('td', { class: 'num', text: '—' }), h('td', { class: 'num', text: o.sc + ' / ' + o.mx })));
    });
    if (badgeList().length) rows.push(h('tr', null, h('th', { scope: 'row', text: 'Badges obtenus' }), h('td', { class: 'num', text: '—' }), h('td', { class: 'num', text: badgeCount() + ' / ' + badgeList().length })));
    c.appendChild(h('div', { class: 'tscroll' }, h('table', { class: 'dt' }, h('caption', { text: 'Étapes terminées et points des exercices corrigés automatiquement' }),
      h('thead', null, h('tr', null, h('th', { scope: 'col', text: 'Partie du cours' }), h('th', { scope: 'col', class: 'num', text: 'Étapes' }), h('th', { scope: 'col', class: 'num', text: 'Points' }))), h('tbody', null, rows))));

    c.appendChild(h('h2', { text: 'Mes compositions rédigées' }));
    var sb = synthBlocks(), any = false;
    sb.forEach(function (x) {
      var st = Store.S.blocks[x.b.id] || {};
      c.appendChild(h('h3', { text: x.label }));
      if (st.t && st.t.trim()) { any = true; c.appendChild(h('div', { class: 'syn', text: st.t.trim() })); }
      else c.appendChild(h('p', { class: 'hint', text: 'Pas encore rédigée.' }));
    });
    if (!any) c.appendChild(h('p', { class: 'warn', text: 'Vous n\'avez pas encore rédigé de composition. Elles se trouvent à la fin des parties 1 et 3.' }));

    c.appendChild(h('h2', { class: 'noprint', text: 'Rendre mon travail' }));
    c.appendChild(h('p', { class: 'noprint', html: L.meta.bilanRendre }));
    c.appendChild(h('div', { class: 'btns noprint' },
      h('button', { type: 'button', class: 'btn', onclick: function () { window.print(); } }, '🖨️ Imprimer / enregistrer en PDF')));

    // sauvegarde / transfert
    var det = h('details', { class: 'bloc det noprint' }, h('summary', { text: 'Changer d\'appareil ou sauvegarder mon travail' }));
    det.appendChild(h('p', { text: 'Vos réponses sont enregistrées dans ce navigateur, sur cet appareil uniquement. Pour continuer sur un autre appareil, téléchargez votre sauvegarde puis chargez-la là-bas.' }));
    var imsg = h('p', { class: 'res part', role: 'status', 'aria-live': 'polite' });
    var file = h('input', { type: 'file', accept: '.json,application/json', id: 'impFile', style: 'display:none' });
    file.addEventListener('change', function () {
      var f = file.files && file.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { try { Store.importJSON(String(r.result)); S = Store.S; applyA11y(); buildNav(); route(true); } catch (e) { imsg.textContent = 'Ce fichier n\'est pas une sauvegarde valable.'; } };
      r.readAsText(f);
    });
    var reset = h('button', { type: 'button', class: 'btn sec' }, '🗑 Effacer mes réponses sur cet appareil'), armed = false;
    reset.addEventListener('click', function () {
      if (!armed) { armed = true; reset.textContent = 'Confirmer : tout effacer'; imsg.textContent = 'Cette action supprime vos réponses et votre progression sur cet appareil. Cliquez encore pour confirmer.'; return; }
      Store.reset(); S = Store.S; applyA11y(); buildNav(); route(true);
    });
    det.appendChild(h('div', { class: 'btns' },
      h('button', { type: 'button', class: 'btn sec', onclick: function () { download('sauvegarde-methodologie-cas-pratique.json', Store.exportJSON(), 'application/json'); } }, '⬇ Télécharger ma sauvegarde'),
      h('label', { class: 'btn sec', for: 'impFile', tabindex: '0', role: 'button', onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } } }, '⬆ Charger une sauvegarde'), file, reset));
    det.appendChild(imsg);
    c.appendChild(det);
    c.appendChild(h('div', { class: 'stepnav' }, h('a', { class: 'btn sec', href: '#/quiz' }, '← Quiz final'), h('a', { class: 'btn', href: '#/' }, 'Accueil')));
    return [c];
  }

  /* ---------- routeur ---------- */
  function parse() {
    var p = (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
    if (!p.length) return { v: 'home', t: L.meta.titre };
    if (p[0] === 'diag') return { v: 'diag', t: L.diag.titre };
    if (p[0] === 'quiz') return { v: 'quiz', t: L.quiz.titre };
    if (p[0] === 'bilan') return { v: 'bilan', t: 'Mon bilan' };
    if (p[0] === 'badges') return { v: 'badges', t: 'Mes badges' };
    if (p[0] === 'm') {
      var n = parseInt(p[1], 10), m = mod(n); if (!m) return { v: 'home', t: L.meta.titre };
      var k = parseInt(p[2], 10);
      if (k >= 1 && m.steps[k - 1]) return { v: 'step', n: n, k: k, t: m.steps[k - 1].titre + ' · ' + m.lib };
      return { v: 'module', n: n, t: m.lib + ' · ' + m.titre };
    }
    return { v: 'home', t: L.meta.titre };
  }
  function fixHeadings() {
    var prev = 0;
    main.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function (e) {
      var lv = +e.tagName.charAt(1);
      if (e.hasAttribute('data-fl')) { e.removeAttribute('aria-level'); e.removeAttribute('data-fl'); }
      if (prev && lv > prev + 1) { e.setAttribute('aria-level', String(prev + 1)); e.setAttribute('data-fl', '1'); lv = prev + 1; }
      prev = lv;
    });
  }
  function route(force) {
    var r = parse(), id = (location.hash || '#/');
    if (r.v === 'step' && !unlocked(r.n, r.k)) {
      var fo = firstOpen();
      if (fo) { lockNotice = 'Cette étape est verrouillée : terminez d\'abord l\'étape ' + fo.k + ' (' + mod(fo.n).lib + '), puis les suivantes dans l\'ordre.'; location.replace('#/m/' + fo.n + '/' + fo.k); return; }
    }
    if (r.v === 'quiz' && !courseDone()) {
      var fq = firstOpen();
      if (fq) { lockNotice = 'Le quiz final se débloque quand vous avez terminé ' + L.meta.parcours + ' : continuez avec l\'étape ' + fq.k + ' (' + mod(fq.n).lib + ').'; location.replace('#/m/' + fq.n + '/' + fq.k); return; }
    }
    var views = { home: viewHome, diag: viewDiag, quiz: viewQuiz, bilan: viewBilan, badges: viewBadges, module: function () { return viewModule(r.n); }, step: function () { return viewStep(r.n, r.k); } };
    var nodes = views[r.v]();
    var tb = document.getElementById('toast'); if (tb && id !== lastRoute) tb.hidden = true;   // la notification disparaît quand on change de page
    main.innerHTML = '';
    nodes.forEach(function (x) { main.appendChild(x); });
    fixHeadings();
    document.title = r.t + ' · La méthodologie du cas pratique';
    buildNav();
    sideEl.classList.remove('open'); document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
    if (id !== lastRoute || force === true) { window.scrollTo(0, 0); }
    if (id !== lastRoute) { try { main.focus({ preventScroll: true }); } catch (e) { main.focus(); } }
    lastRoute = id;
  }
  window.addEventListener('hashchange', function () { route(); });

  // Tableaux qui défilent horizontalement : atteignables au clavier (Tab, puis flèches)
  function focusTables() {
    main.querySelectorAll('.tscroll:not([tabindex])').forEach(function (e) {
      e.setAttribute('tabindex', '0');
    });
  }
  if (window.MutationObserver) new MutationObserver(function () { focusTables(); fixHeadings(); }).observe(main, { childList: true, subtree: true });

  if (!window.LMS) { main.textContent = 'Le contenu du cours est introuvable (js/content.js).'; return; }
  initA11y();
  checkBadges();
  route();
})();

</script>
